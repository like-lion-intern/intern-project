<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의 분석 업로드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7fa;
      --white: #ffffff;
      --border: #e4e8ef;
      --accent: #5b5ef6;
      --accent-light: #eeecff;
      --accent-dark: #4040d4;
      --text: #111827;
      --text-sub: #4b5563;
      --text-muted: #9ca3af;
      --shadow: 0 4px 16px rgba(0,0,0,0.07);
      --radius: 14px;
      --radius-sm: 8px;
    }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-badge {
      font-size: 0.7rem;
      background: var(--accent-light);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }
    .page {
      max-width: 640px;
      margin: 80px auto;
      padding: 0 24px;
    }
    .upload-hero { text-align: center; margin-bottom: 40px; }
    .upload-hero h1 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
    .upload-hero p { color: var(--text-sub); font-size: 1rem; }
    .upload-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow);
    }
    .drop-zone {
      border: 2px dashed #d1d5db;
      border-radius: var(--radius-sm);
      padding: 52px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      background: var(--bg);
    }
    .drop-zone:hover, .drop-zone.over {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .drop-icon { font-size: 2.8rem; margin-bottom: 14px; }
    .drop-label { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
    .drop-sub { font-size: 0.83rem; color: var(--text-muted); }
    .file-chip {
      display: none;
      margin-top: 14px;
      align-items: center;
      gap: 10px;
      background: var(--accent-light);
      border: 1px solid #c4c0fb;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--accent);
    }
    .file-chip.show { display: flex; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
      margin-top: 16px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(91,94,246,0.35);
    }
    .btn-primary:disabled { background: #c7c9fb; cursor: not-allowed; color: #fff; }
    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      opacity: 0.7;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sub-link {
      margin-top: 14px;
      text-align: center;
      font-size: 0.84rem;
      color: var(--text-muted);
    }
    .sub-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.87rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      display: none;
      z-index: 999;
      max-width: 320px;
    }
    .toast.error { border-color: #dc2626; color: #dc2626; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">🎓 강의 분석 시스템 <span class="nav-badge">AI Report</span></div>
  </nav>

  <div class="page">
    <div class="upload-hero">
      <h1>강의 품질 분석</h1>
      <p>STT 파일을 업로드하면 AI가 18개 항목을 자동 평가하고<br>상세 리포트를 생성합니다</p>
    </div>
    <div class="upload-card">
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".txt" />
        <div class="drop-icon">📄</div>
        <div class="drop-label">파일을 드래그하거나 클릭하여 선택</div>
        <div class="drop-sub">화자 ID 제거된 .txt 파일 (예: 2026-02-02_kdt.txt)</div>
      </div>
      <div class="file-chip" id="fileChip">📎 <span id="fileName"></span></div>
      <button class="btn btn-primary" id="uploadBtn" disabled>분석 시작</button>
      <div class="sub-link">이미 Job ID가 있으면 <a id="goProgress" href="/site/progress.html">진행 페이지</a>에서 확인</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '/api/v1';
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const uploadBtn = document.getElementById('uploadBtn');

    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    async function parseApiBody(res) {
      const text = await res.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch {
        return { detail: text };
      }
    }

    function extractErrorMessage(payload, res) {
      if (payload && typeof payload === 'object') {
        if (typeof payload.detail === 'string') return payload.detail;
        if (typeof payload.message === 'string') return payload.message;
        if (typeof payload.error === 'string') return payload.error;
      }
      return `HTTP ${res.status} ${res.statusText}`;
    }

    function onFileChosen(file) {
      if (!file) return;
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileChip').classList.add('show');
      uploadBtn.disabled = false;
    }

    fileInput.addEventListener('change', () => onFileChosen(fileInput.files[0]));
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (f) {
        fileInput.files = e.dataTransfer.files;
        onFileChosen(f);
      }
    });

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px"><span class="spinner" style="border-color:#fff;border-top-color:transparent;display:inline-block;width:14px;height:14px;border-radius:50%;border-width:2px;animation:spin .7s linear infinite"></span> 업로드 중...</span>';

      const form = new FormData();
      form.append('file', file);

      try {
        const res = await fetch(`${API}/analyze`, { method: 'POST', body: form });
        const data = await parseApiBody(res);
        if (!res.ok) throw new Error(extractErrorMessage(data, res));

        sessionStorage.setItem('analysis.jobId', data.job_id);
        sessionStorage.setItem('analysis.filename', file.name);
        window.location.href = `/site/progress.html?job_id=${encodeURIComponent(data.job_id)}`;
      } catch (e) {
        showToast('업로드 실패: ' + e.message, true);
        uploadBtn.disabled = false;
        uploadBtn.textContent = '분석 시작';
      }
    });

    document.getElementById('goProgress').addEventListener('click', (e) => {
      const jobId = sessionStorage.getItem('analysis.jobId');
      if (!jobId) return;
      e.preventDefault();
      window.location.href = `/site/progress.html?job_id=${encodeURIComponent(jobId)}`;
    });
  </script>
</body>
</html>
