<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강의 분석 리포트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7fa;
      --white: #ffffff;
      --border: #e4e8ef;
      --border-light: #f0f2f5;
      --accent: #5b5ef6;
      --accent-light: #eeecff;
      --text: #111827;
      --text-sub: #4b5563;
      --text-muted: #9ca3af;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --yellow: #d97706;
      --yellow-bg: #fffbeb;
      --blue: #2563eb;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 4px 16px rgba(0,0,0,0.07);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
      --radius: 14px;
    }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .nav-badge {
      font-size: 0.7rem;
      background: var(--accent-light);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }
    #reportPage { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
    .report-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .report-topbar h2 { font-size: 1.5rem; font-weight: 800; }
    .report-date { font-size: 0.85rem; color: var(--text-muted); }
    .btn-new {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--white);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      color: var(--text-sub);
      text-decoration: none;
    }
    .btn-new:hover { border-color: var(--accent); color: var(--accent); }
    .btn-download {
      border-color: #bfdbfe;
      color: var(--blue);
      background: #eff6ff;
    }
    .btn-download:hover {
      border-color: #93c5fd;
      color: #1d4ed8;
      background: #dbeafe;
    }
    .btn-download:disabled { opacity: 0.65; cursor: not-allowed; }
    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media(max-width:640px){ .summary-row { grid-template-columns: 1fr; } }
    .summary-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
    }
    .summary-card-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .summary-card-value { font-size: 2rem; font-weight: 800; }
    .summary-card-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .overall-text-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .overall-text-card .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 12px;
    }
    .overall-text { font-size: 0.93rem; line-height: 1.7; color: var(--text-sub); }
    .kv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media(max-width:640px){ .kv-grid { grid-template-columns: 1fr; } }
    .kv-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    .kv-card .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 10px;
    }
    .kv-card.strengths .section-title { color: var(--green); }
    .kv-card.weaknesses .section-title { color: var(--red); }
    .kv-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .kv-list li {
      font-size: 0.84rem;
      color: var(--text-sub);
      display: flex;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.45;
    }
    .kv-list li::before {
      content: attr(data-mark);
      flex-shrink: 0;
      font-weight: 700;
      font-size: 0.78rem;
      margin-top: 1px;
    }
    .kv-card.strengths li::before { color: var(--green); content: "✓"; }
    .kv-card.weaknesses li::before { color: var(--red); content: "✗"; }
    .section-heading {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }
    .cat-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }
    .cat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .cat-header:hover { background: #fafafa; }
    .cat-left { display: flex; align-items: center; gap: 14px; }
    .cat-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .cat-name { font-weight: 700; font-size: 0.97rem; }
    .cat-count { font-size: 0.78rem; color: var(--text-muted); }
    .cat-right { display: flex; align-items: center; gap: 16px; }
    .score-ring { position: relative; width: 48px; height: 48px; }
    .score-ring svg { transform: rotate(-90deg); }
    .score-ring-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.88rem;
    }
    .chevron { font-size: 0.75rem; color: var(--text-muted); transition: transform 0.2s; }
    .cat-body {
      display: none;
      border-top: 1px solid var(--border-light);
      padding: 20px 22px 22px;
    }
    .cat-body.open { display: block; }
    .cat-summary-text {
      font-size: 0.87rem;
      color: var(--text-sub);
      line-height: 1.55;
      margin-bottom: 18px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 8px;
    }
    .items-wrap { overflow-x: auto; }
    table.items {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    table.items th {
      text-align: left;
      padding: 8px 12px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }
    table.items td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }
    table.items tr:last-child td { border-bottom: none; }
    .item-name-cell { font-weight: 600; white-space: nowrap; }
    .score-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .score-mini-bar {
      height: 4px;
      border-radius: 99px;
      background: #e5e7eb;
      margin-top: 4px;
      max-width: 80px;
    }
    .score-mini-bar-fill { height: 100%; border-radius: 99px; }
    .reason-cell { color: var(--text-sub); line-height: 1.5; }
    .tip-cell {
      color: var(--blue);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .cat-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-light);
    }
    .tag {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 500;
    }
    .tag-strength { background: var(--green-bg); color: var(--green); }
    .tag-weakness { background: var(--red-bg); color: var(--red); }
    .priority-card {
      background: linear-gradient(135deg, #f0f4ff, #e8eaff);
      border: 1px solid #c7cbfb;
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 0;
    }
    .priority-card .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 12px;
    }
    .priority-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .priority-list li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .priority-num {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .empty-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      text-align: center;
      color: var(--text-sub);
      box-shadow: var(--shadow-sm);
    }
    .empty-card a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.87rem;
      box-shadow: var(--shadow-lg);
      display: none;
      z-index: 999;
      max-width: 320px;
    }
    .toast.error { border-color: var(--red); color: var(--red); }
    .sc1 { color: var(--red); background: var(--red-bg); }
    .sc2 { color: #ea580c; background: #fff7ed; }
    .sc3 { color: var(--yellow); background: var(--yellow-bg); }
    .sc4 { color: #16a34a; background: #dcfce7; }
    .sc5 { color: var(--green); background: var(--green-bg); }
    .sbar1 { background: var(--red); }
    .sbar2 { background: #ea580c; }
    .sbar3 { background: var(--yellow); }
    .sbar4 { background: #16a34a; }
    .sbar5 { background: var(--green); }
    .sring1 { stroke: var(--red); }
    .sring2 { stroke: #ea580c; }
    .sring3 { stroke: var(--yellow); }
    .sring4 { stroke: #16a34a; }
    .sring5 { stroke: var(--green); }
    .ci0 { background: #eef2ff; }
    .ci1 { background: #fdf4ff; }
    .ci2 { background: #fff7ed; }
    .ci3 { background: #f0fdf4; }
    .ci4 { background: #eff6ff; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/site/index.html">🎓 강의 분석 시스템 <span class="nav-badge">AI Report</span></a>
    <a class="btn-new" href="/site/index.html">＋ 새 강의 분석</a>
  </nav>

  <div id="reportPage">
    <div class="report-topbar">
      <div>
        <h2>📊 강의 분석 리포트</h2>
        <div class="report-date" id="reportDate"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn-new btn-download" id="pdfBtn" onclick="downloadReportPdf()">⬇ PDF 다운로드</button>
        <a class="btn-new" href="/site/index.html">＋ 새 강의 분석</a>
      </div>
    </div>

    <div id="emptyState" class="empty-card" style="display:none;">
      표시할 리포트 데이터가 없습니다.<br />
      <a href="/site/index.html">파일 업로드 페이지로 이동</a>
    </div>

    <div id="reportContent">
      <div class="summary-row" id="summaryRow"></div>

      <div class="overall-text-card">
        <div class="section-title">종합 평가</div>
        <div class="overall-text" id="overallText"></div>
      </div>

      <div class="kv-grid" id="kvGrid"></div>

      <div class="section-heading">📋 카테고리별 상세 분석</div>
      <div class="cat-grid" id="catGrid"></div>

      <div class="section-heading">🎯 우선 개선 과제</div>
      <div class="priority-card">
        <div class="section-title">Priority Improvements</div>
        <ul class="priority-list" id="priorityList"></ul>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentLectureId = '';
    const CAT_ICONS = ['📝', '🏗️', '💡', '🛠️', '🤝'];
    const CAT_CI = ['ci0', 'ci1', 'ci2', 'ci3', 'ci4'];

    function toNum(v, fallback = 0) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function normalizeReportShape(raw) {
      if (!raw || typeof raw !== 'object') return null;

      const rawCats = Array.isArray(raw.category_results) ? raw.category_results : [];
      const hasFrontendShape = rawCats.some((c) => Array.isArray(c?.items)) || typeof raw.overall_summary === 'string';
      if (hasFrontendShape) {
        return {
          ...raw,
          overall_summary: raw.overall_summary || '요약 정보 없음',
          overall_strengths: Array.isArray(raw.overall_strengths) ? raw.overall_strengths : [],
          overall_weaknesses: Array.isArray(raw.overall_weaknesses) ? raw.overall_weaknesses : [],
          priority_improvements: Array.isArray(raw.priority_improvements) ? raw.priority_improvements : [],
          category_results: rawCats.map((cat) => ({
            ...cat,
            category_summary: cat.category_summary || cat.reason || '',
            items: Array.isArray(cat.items) ? cat.items : (Array.isArray(cat.top_items) ? cat.top_items : []),
            strengths: Array.isArray(cat.strengths) ? cat.strengths : [],
            weaknesses: Array.isArray(cat.weaknesses) ? cat.weaknesses : [],
            improvements: Array.isArray(cat.improvements) ? cat.improvements : [],
          })),
        };
      }

      // Backend result.json shape fallback
      const normalizedCats = rawCats.map((cat) => {
        const score = toNum(cat.final_score ?? cat.heuristic_score, 0);
        const isWeak = score < 2.8;
        const strengths = Array.isArray(cat.strengths) ? cat.strengths : (isWeak ? [] : [`${cat.category_name} 수행이 상대적으로 안정적입니다.`]);
        const weaknesses = Array.isArray(cat.weaknesses) ? cat.weaknesses : (isWeak ? [`${cat.category_name} 개선이 필요합니다.`] : []);
        const items = (Array.isArray(cat.top_items) ? cat.top_items : []).map((item) => ({
          ...item,
          improvement_tip: item.improvement_tip || '',
        }));
        return {
          ...cat,
          category_summary: cat.category_summary || cat.reason || '',
          strengths,
          weaknesses,
          improvements: Array.isArray(cat.improvements) ? cat.improvements : [],
          items,
        };
      });

      const weakFromLecture = raw.lecture_summary?.overall_weak_categories;
      const weakCats = Array.isArray(weakFromLecture)
        ? weakFromLecture
        : normalizedCats
            .filter((c) => toNum(c.final_score ?? c.heuristic_score, 0) < 2.8)
            .map((c) => c.category_name);

      const strongCats = normalizedCats
        .filter((c) => toNum(c.final_score ?? c.heuristic_score, 0) >= 3.3)
        .sort((a, b) => toNum(b.final_score ?? b.heuristic_score, 0) - toNum(a.final_score ?? a.heuristic_score, 0))
        .slice(0, 2)
        .map((c) => `${c.category_name} 카테고리 수행이 안정적임`);

      const avgScore = normalizedCats.length
        ? (normalizedCats.reduce((acc, c) => acc + toNum(c.final_score ?? c.heuristic_score, 0), 0) / normalizedCats.length).toFixed(2)
        : '-';

      return {
        lecture_id: raw.lecture_id || '',
        overall_summary: `강의 종합 점수는 ${avgScore}/5.0이며, 취약 카테고리 중심 개선이 필요합니다.`,
        overall_strengths: strongCats,
        overall_weaknesses: weakCats.map((n) => `${n} 카테고리 보강 필요`),
        priority_improvements: weakCats.map((n) => `${n} 중심 개선 우선`),
        category_results: normalizedCats,
      };
    }

    function scoreClass(s) {
      if (s >= 4.5) return '5';
      if (s >= 3.5) return '4';
      if (s >= 2.5) return '3';
      if (s >= 1.5) return '2';
      return '1';
    }

    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    function toggleCat(header) {
      const body = header.nextElementSibling;
      const ch = header.querySelector('.chevron');
      const open = body.classList.toggle('open');
      if (ch) ch.style.transform = open ? 'rotate(90deg)' : '';
    }

    function renderReport(report, fallbackLectureId) {
      if (!report || typeof report !== 'object') {
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('reportContent').style.display = 'none';
        return;
      }

      currentLectureId = report.lecture_id || fallbackLectureId || 'lecture_report';
      document.getElementById('reportDate').textContent =
        currentLectureId + ' · ' + new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });

      const cats = report.category_results || [];
      const scores = cats.map((c) => +(c.final_score ?? c.heuristic_score ?? 0));
      const avg = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(2) : '-';
      const best = cats.reduce((a, b) => (+a.final_score || +a.heuristic_score || 0) > (+b.final_score || +b.heuristic_score || 0) ? a : b, cats[0] || {});
      const worst = cats.reduce((a, b) => (+a.final_score || +a.heuristic_score || 0) < (+b.final_score || +b.heuristic_score || 0) ? a : b, cats[0] || {});

      const sc = scoreClass(+avg);
      document.getElementById('summaryRow').innerHTML = `
        <div class="summary-card">
          <div class="summary-card-label">종합 점수</div>
          <div class="summary-card-value sc${sc}" style="background:none">${avg}</div>
          <div class="summary-card-sub">/ 5.0 점 (18개 항목)</div>
        </div>
        <div class="summary-card">
          <div class="summary-card-label">최고 카테고리</div>
          <div class="summary-card-value" style="font-size:1.1rem;color:var(--green)">${best.category_name || '—'}</div>
          <div class="summary-card-sub">${(+(best.final_score ?? best.heuristic_score ?? 0)).toFixed(2)}점</div>
        </div>
        <div class="summary-card">
          <div class="summary-card-label">개선 필요</div>
          <div class="summary-card-value" style="font-size:1.1rem;color:var(--red)">${worst.category_name || '—'}</div>
          <div class="summary-card-sub">${(+(worst.final_score ?? worst.heuristic_score ?? 0)).toFixed(2)}점</div>
        </div>`;

      document.getElementById('overallText').textContent = report.overall_summary || '요약 정보 없음';

      const strItems = (report.overall_strengths || []).map((s) => `<li>${s}</li>`).join('');
      const weakItems = (report.overall_weaknesses || []).map((w) => `<li>${w}</li>`).join('');
      document.getElementById('kvGrid').innerHTML = `
        <div class="kv-card strengths">
          <div class="section-title">강점</div>
          <ul class="kv-list">${strItems || '<li>정보 없음</li>'}</ul>
        </div>
        <div class="kv-card weaknesses">
          <div class="section-title">개선 필요</div>
          <ul class="kv-list">${weakItems || '<li>정보 없음</li>'}</ul>
        </div>`;

      const catGrid = document.getElementById('catGrid');
      catGrid.innerHTML = '';

      cats.forEach((cat, idx) => {
        const sc2 = +(cat.final_score ?? cat.heuristic_score ?? 0).toFixed(2);
        const cls = scoreClass(sc2);
        const pct = ((sc2 - 1) / 4 * 100).toFixed(0);
        const r = 18;
        const circ = 2 * Math.PI * r;
        const dash = (circ * pct / 100).toFixed(1);

        const items = (cat.items || []).map((item) => {
          const isc = +(item.final_score ?? item.heuristic_score ?? 0).toFixed(2);
          const ic = scoreClass(isc);
          const ipct = ((isc - 1) / 4 * 100).toFixed(0);
          return `<tr>
            <td class="item-name-cell">${item.item_name || ''}</td>
            <td>
              <span class="score-badge sc${ic}">${isc}</span>
              <div class="score-mini-bar"><div class="score-mini-bar-fill sbar${ic}" style="width:${ipct}%"></div></div>
            </td>
            <td class="reason-cell">${item.reason || ''}</td>
            <td class="tip-cell">${item.improvement_tip ? '💡 ' + item.improvement_tip : ''}</td>
          </tr>`;
        }).join('');

        const tags = [
          ...(cat.strengths || []).slice(0, 3).map((s) => `<span class="tag tag-strength">✓ ${s}</span>`),
          ...(cat.weaknesses || []).slice(0, 3).map((w) => `<span class="tag tag-weakness">✗ ${w}</span>`),
        ].join('');

        const el = document.createElement('div');
        el.className = 'cat-card';
        el.innerHTML = `
          <div class="cat-header" onclick="toggleCat(this)">
            <div class="cat-left">
              <div class="cat-icon ${CAT_CI[idx] || 'ci0'}">${CAT_ICONS[idx] || '📌'}</div>
              <div>
                <div class="cat-name">${cat.category_name}</div>
                <div class="cat-count">${(cat.items || []).length}개 항목</div>
              </div>
            </div>
            <div class="cat-right">
              <div class="score-ring">
                <svg width="48" height="48" viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="4"/>
                  <circle cx="24" cy="24" r="${r}" fill="none" class="sring${cls}" stroke-width="4" stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
                </svg>
                <div class="score-ring-num sc${cls}" style="background:none">${sc2}</div>
              </div>
              <span class="chevron">▶</span>
            </div>
          </div>
          <div class="cat-body${idx === 0 ? ' open' : ''}">
            ${cat.category_summary ? `<div class="cat-summary-text">${cat.category_summary}</div>` : ''}
            <div class="items-wrap">
              <table class="items">
                <thead><tr><th>항목</th><th>점수</th><th>평가 이유</th><th>개선 팁</th></tr></thead>
                <tbody>${items}</tbody>
              </table>
            </div>
            ${tags ? `<div class="cat-tags">${tags}</div>` : ''}
          </div>`;
        catGrid.appendChild(el);
      });

      const pList = report.priority_improvements || [];
      document.getElementById('priorityList').innerHTML = pList.length
        ? pList.map((p, i) => `<li><span class="priority-num">${i + 1}</span>${p}</li>`).join('')
        : '<li>정보 없음</li>';
    }

    function normalizeFileName(name) {
      return String(name || 'lecture_report')
        .replace(/[\\/:*?"<>|]+/g, '_')
        .replace(/\s+/g, '_')
        .slice(0, 80);
    }

    function openAllCategoriesForCapture() {
      const bodies = Array.from(document.querySelectorAll('.cat-body'));
      const headers = Array.from(document.querySelectorAll('.cat-header'));
      const prevStates = bodies.map((b) => b.classList.contains('open'));
      bodies.forEach((b) => b.classList.add('open'));
      headers.forEach((h) => {
        const ch = h.querySelector('.chevron');
        if (ch) ch.style.transform = 'rotate(90deg)';
      });
      return () => {
        bodies.forEach((b, i) => { b.classList.toggle('open', prevStates[i]); });
        headers.forEach((h, i) => {
          const ch = h.querySelector('.chevron');
          if (!ch) return;
          ch.style.transform = prevStates[i] ? 'rotate(90deg)' : '';
        });
      };
    }

    async function downloadReportPdf() {
      const btn = document.getElementById('pdfBtn');
      const reportEl = document.getElementById('reportPage');
      if (!reportEl || !window.html2canvas || !window.jspdf) {
        showToast('PDF 라이브러리를 불러오지 못했습니다.', true);
        return;
      }

      const restore = openAllCategoriesForCapture();
      const previousText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'PDF 생성 중...';

      try {
        const canvas = await window.html2canvas(reportEl, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#f5f7fa',
          windowWidth: Math.max(document.documentElement.clientWidth, reportEl.scrollWidth),
        });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const imgWidth = pageWidth;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        const imgData = canvas.toDataURL('image/png');

        let y = 0;
        pdf.addImage(imgData, 'PNG', 0, y, imgWidth, imgHeight, undefined, 'FAST');
        while (y + imgHeight > pageHeight) {
          y -= pageHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, y, imgWidth, imgHeight, undefined, 'FAST');
        }

        const today = new Date().toISOString().slice(0, 10);
        const fileName = `${normalizeFileName(currentLectureId)}_report_${today}.pdf`;
        pdf.save(fileName);
        showToast('PDF 다운로드를 시작했습니다.');
      } catch (e) {
        showToast('PDF 생성 실패: ' + (e && e.message ? e.message : e), true);
      } finally {
        restore();
        btn.disabled = false;
        btn.textContent = previousText;
      }
    }

    function init() {
      const reportRaw = sessionStorage.getItem('analysis.finalReport');
      const lectureId = sessionStorage.getItem('analysis.lectureId') || sessionStorage.getItem('analysis.filename') || 'lecture_report';
      if (!reportRaw) {
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('reportContent').style.display = 'none';
        return;
      }

      try {
        const parsed = JSON.parse(reportRaw);
        const report = normalizeReportShape(parsed);
        renderReport(report, lectureId);
      } catch (e) {
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('reportContent').style.display = 'none';
        showToast('리포트 데이터 파싱 실패: ' + (e && e.message ? e.message : e), true);
      }
    }

    init();
  </script>
</body>
</html>
